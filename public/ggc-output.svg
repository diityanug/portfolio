  <text x="720" y="146" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="800" fill="#4B6043">94.9%</text>

  <!-- Segmented Bar -->
  <rect x="80" y="164" width="640" height="12" rx="6" fill="#F5F5F4"/>
  <rect x="80" y="164" width="606" height="12" rx="6" fill="#536856"/>

