  <text x="104" y="302" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#44403C">"Embark on an <tspan font-weight="700" fill="#15803D" text-decoration="underline">epic journey</tspan> across a vast open world filled with ancient ruins,</text>
