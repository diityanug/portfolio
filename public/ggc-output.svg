  <text x="720" y="454" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#57534E">84.9%</text>
  <rect x="80" y="466" width="640" height="10" rx="5" fill="#F5F5F4"/>
  <rect x="80" y="466" width="543" height="10" rx="5" fill="#94A396"/>

