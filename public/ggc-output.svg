  <text x="80" y="510" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#292524">Open World</text>
  <text x="202" y="509" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#78716C">• Keywords: open world, explore, landscapes</text>
  <text x="720" y="510" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#57534E">84.4%</text>
