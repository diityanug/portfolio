  <rect x="576" y="206" width="128" height="24" rx="8" fill="#EEF2EC"/>
  <text x="640" y="222" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#536856">LOG_PROB_XAI</text>

  <!-- Keyword Chips -->
  <rect x="104" y="238" width="90" height="32" rx="10" fill="#FFFFFF" stroke="#D6DDD4" stroke-width="1.2"/>
  <text x="149" y="259" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#292524">horizon</text>

  <rect x="204" y="238" width="88" height="32" rx="10" fill="#FFFFFF" stroke="#D6DDD4" stroke-width="1.2"/>
  <text x="248" y="259" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#292524">eternal</text>

