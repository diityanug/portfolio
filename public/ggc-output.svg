  <text x="136" y="397" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#78716C">• Keywords: quests, kingdom, ancient</text>
  <text x="720" y="398" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#57534E">91.9%</text>
