      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B18"/>
    </linearGradient>
    <filter id="darkShadow1" x="-5%" y="-5%" width="110%" height="115%">
