  <text x="312" y="438" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">Back</text>

  <rect x="364" y="418" width="84" height="32" rx="16" fill="#11151F" stroke="#1E2536"/>
  <text x="406" y="438" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#CBD5E1">Legs</text>

