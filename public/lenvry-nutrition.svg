  <text x="678" y="404" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#2DD4BF">510 kcal</text>
  <text x="444" y="426" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">Lunch • <tspan fill="#38BDF8" font-weight="700">48g P</tspan> • 52g C • 11g F</text>

  <rect x="428" y="456" width="266" height="66" rx="14" fill="#161B28" stroke="#22293A"/>
  <text x="444" y="480" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#F8FAFC">Telur &amp; Oatmeal</text>
  <text x="678" y="480" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#2DD4BF">410 kcal</text>
  <text x="444" y="502" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94A3B8">Breakfast • <tspan fill="#38BDF8" font-weight="700">26g P</tspan> • 44g C • 14g F</text>
