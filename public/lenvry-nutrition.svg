  <rect x="242" y="486" width="128" height="38" rx="12" fill="#161B28" stroke="#22293A"/>
  <text x="306" y="510" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#38BDF8">＋ 500 ml Bottle</text>

