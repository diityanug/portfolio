  <rect x="84" y="258" width="308" height="74" rx="18" fill="#11151F" stroke="#1E2536"/>
  <rect x="104" y="276" width="34" height="34" rx="10" fill="#0D2821"/>
  <text x="121" y="298" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="900" fill="#10B981">↓</text>
