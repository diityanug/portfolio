  <rect x="246" y="208" width="156" height="24" rx="8" fill="#0D2821" stroke="#10B981" stroke-opacity="0.35"/>
  <text x="324" y="224" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#34D399">Surplus +Rp 8.180.000</text>

