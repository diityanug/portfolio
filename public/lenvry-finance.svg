  <text x="150" y="312" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="900" fill="#10B981">+Rp 12.500.000</text>

  <rect x="408" y="258" width="308" height="74" rx="18" fill="#11151F" stroke="#1E2536"/>
  <rect x="428" y="276" width="34" height="34" rx="10" fill="#2A161D"/>
  <text x="445" y="298" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="900" fill="#F43F5E">↑</text>
