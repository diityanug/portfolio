<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="lenvryBg4" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#08101D"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#091526"/>
    </linearGradient>
    <filter id="darkShadow4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#lenvryBg4)"/>
  <circle cx="680" cy="90" r="150" fill="#38BDF8" fill-opacity="0.14"/>
  <circle cx="110" cy="510" r="150" fill="#10B981" fill-opacity="0.08"/>

  <!-- Main App Shell -->
  <g filter="url(#darkShadow4)">
    <rect x="48" y="32" width="704" height="536" rx="28" fill="#0B0D13" stroke="#1E2433" stroke-width="1.5"/>
  </g>

  <!-- Header -->
  <text x="84" y="82" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="900" fill="#F8FAFC" letter-spacing="-0.5">Finance</text>
  <text x="84" y="104" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748B">Multi-currency net worth, pockets, debts &amp; recurring bills</text>

  <rect x="622" y="56" width="94" height="38" rx="19" fill="#38BDF8"/>
  <text x="669" y="80" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#082F49">＋ Add</text>

