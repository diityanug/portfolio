  <rect x="430" y="464" width="264" height="62" rx="14" fill="#161B28" stroke="#22293A"/>
  <text x="446" y="488" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#F8FAFC">Recurring • Fiber Internet &amp; Cloud</text>
