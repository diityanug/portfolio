  <text x="619" y="156" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="900" fill="#082F49">IDR</text>
  <text x="666" y="156" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">USD</text>

  <text x="108" y="194" font-family="Inter, system-ui, sans-serif" font-size="34" font-weight="900" fill="#F8FAFC">Rp 28.450.000</text>

