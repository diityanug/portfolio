  <text x="132" y="224" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="700" fill="#FAF9F5" letter-spacing="-1">Rp 48.750.000</text>
  
  <!-- Sub badges inside dark card -->
  <rect x="132" y="248" width="176" height="32" rx="10" fill="#252320"/>
  <circle cx="150" cy="264" r="5" fill="#5DB872"/>
  <text x="164" y="269" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#FAF9F5">Inflow +Rp 18,5M</text>

  <rect x="320" y="248" width="184" height="32" rx="10" fill="#252320"/>
  <circle cx="338" cy="264" r="5" fill="#CC785C"/>
  <text x="352" y="269" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#FAF9F5">Outflow -Rp 6,2M</text>

  <!-- Privacy Mode badge -->
