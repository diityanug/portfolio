  <text x="612" y="178" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#E8A55A">Privacy Ready</text>

  <!-- Unified Accounts Preview -->
  <text x="100" y="342" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#6C6A64" letter-spacing="1">UNIFIED ACCOUNTS (IDR &amp; USD)</text>

  <rect x="100" y="360" width="290" height="92" rx="18" fill="#FAF9F5" stroke="#E6DFD8" stroke-width="1.5"/>
  <rect x="120" y="380" width="44" height="44" rx="12" fill="#EBF7F4"/>
  <text x="142" y="407" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#11473B">BCA</text>
  <text x="178" y="398" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#141413">Main Bank • IDR</text>
  <text x="178" y="422" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#5DB8A6">Rp 32.400.000</text>

  <rect x="410" y="360" width="290" height="92" rx="18" fill="#FAF9F5" stroke="#E6DFD8" stroke-width="1.5"/>
  <rect x="430" y="380" width="44" height="44" rx="12" fill="#FDF0ED"/>
  <text x="452" y="407" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#CC785C">USD</text>
  <text x="488" y="398" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#141413">Global Vault • USD</text>
  <text x="488" y="422" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#CC785C">$ 2,450.00</text>

