  <text x="100" y="112" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" fill="#6C6A64">Unified Multi-Currency Balance • Offline SQLite</text>
  
  <!-- Currency Switcher Pill -->
  <rect x="596" y="68" width="104" height="36" rx="18" fill="#EFE9DE" stroke="#E6DFD8"/>
  <rect x="600" y="72" width="48" height="28" rx="14" fill="#181715"/>
  <text x="624" y="91" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FAF9F5">IDR</text>
  <text x="674" y="91" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#6C6A64">USD</text>

