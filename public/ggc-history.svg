  <text x="314" y="394" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#B91C1C">Horror</text>
  <text x="86" y="422" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#78716C">Survive psychological terror inside an</text>
  <text x="86" y="440" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#78716C">abandoned Victorian asylum with only...</text>
  <text x="86" y="460" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#57534E">93.8% Match • Survival, Mystery</text>

