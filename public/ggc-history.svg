  <text x="86" y="182" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#78716C">Embark on an epic journey across a vast</text>
  <text x="86" y="200" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#78716C">open world filled with ancient ruins...</text>
  <text x="86" y="220" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#EA580C">Click to reload prediction →</text>

