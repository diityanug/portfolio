  <text x="454" y="198" font-family="monospace" font-size="10.5" font-weight="700" fill="#FB923C">MYSTERY SYNOPSIS #18</text>
  <text x="454" y="224" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F5F5F4">"Command battalion squads across war-torn</text>
  <text x="454" y="246" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F5F5F4">hexagonal territories, manage supply lines,</text>
  <text x="454" y="268" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#F5F5F4">and outmaneuver rival commanders in</text>
