  <rect x="434" y="362" width="142" height="44" rx="12" fill="#292524" stroke="#3F3F46"/>
  <text x="505" y="389" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E7E5E4">Platformer</text>

  <rect x="588" y="362" width="142" height="44" rx="12" fill="#14532D" stroke="#22C55E" stroke-width="2"/>
  <text x="659" y="389" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#86EFAC">✓ Strategy</text>

  <rect x="434" y="418" width="142" height="44" rx="12" fill="#292524" stroke="#3F3F46"/>
  <text x="505" y="445" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E7E5E4">Racing</text>

  <rect x="588" y="418" width="142" height="44" rx="12" fill="#292524" stroke="#3F3F46"/>
  <text x="659" y="445" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E7E5E4">Horror</text>

  <rect x="434" y="474" width="142" height="44" rx="12" fill="#292524" stroke="#3F3F46"/>
  <text x="505" y="501" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E7E5E4">Sports</text>

  <rect x="588" y="474" width="142" height="44" rx="12" fill="#EA580C"/>
  <text x="659" y="501" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">Next Round →</text>
