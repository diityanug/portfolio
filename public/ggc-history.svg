  <rect x="68" y="368" width="294" height="106" rx="16" fill="#FAFAF9" stroke="#E7E5E4"/>
  <text x="86" y="396" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#1C1917">Whispers of Blackwood</text>
